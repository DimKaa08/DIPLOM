
version: "3.9"
name: diplom
services:

  # ── Брокер сообщений ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI бэкенд ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app                        # hot-reload при разработке
      - ml_models:/app/backend/ml    # веса модели между перезапусками
      - .:/app
      - ml_models:/app/backend/ml
      - .:/app
      - ml_models:/app/backend/ml
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery воркер (ML обучение) ───────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=1
      --queues=celery
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - ml_models:/app/backend/ml   # тот же том — воркер видит и пишет модель
      - ml_models:/app/backend/ml
      - ml_models:/app/backend/ml
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A backend.celery_app flower
      --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped

  # ── React / Vite фронтенд ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  ml_models: